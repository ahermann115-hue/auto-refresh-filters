name: Daily Filter Update

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:      # Manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_UPDATE_TOKEN }}
          ref: main

      - name: 🔐 Check token
        run: |
          if [ -z "${{ secrets.AUTO_UPDATE_TOKEN }}" ]; then
            echo "ERROR: AUTO_UPDATE_TOKEN not set!"
            exit 1
          fi
          echo "✅ Token is available"

      - name: 🐍 Setup Python
        run: |
          python3 --version
          pip install mmh3 bitarray --quiet

      - name: 🔧 Setup permissions
        run: |
          chmod +x update.sh

      - name: 🚀 Run update script
        id: run_update
        run: |
          echo "🚀 Запускаем скрипт обновления..."
          ./update.sh
          
          echo "📊 Получаем статистику..."
          
          # Проверяем bloom_filter.bin
          if [ -f "bloom_filter.bin" ]; then
            BLOOM_SIZE=$(stat -c%s bloom_filter.bin)
            BLOOM_SIZE_KB=$((BLOOM_SIZE / 1024))
            echo "✅ bloom_filter.bin: $BLOOM_SIZE байт ($BLOOM_SIZE_KB KB)"
            echo "BLOOM_SIZE_KB=${BLOOM_SIZE_KB}" >> $GITHUB_OUTPUT
            
            if [ "$BLOOM_SIZE" -lt 1000 ]; then
              echo "❌ ОШИБКА: bloom_filter.bin слишком мал!"
              exit 1
            fi
          else
            echo "❌ bloom_filter.bin не найден!"
            exit 1
          fi
          
          # Проверяем blacklist.txt
          if [ -f "blacklist.txt" ]; then
            DOMAIN_COUNT=$(grep -v '^#' blacklist.txt | grep -c '\.')
            echo "✅ blacklist.txt: $DOMAIN_COUNT доменов"
            echo "DOMAIN_COUNT=${DOMAIN_COUNT}" >> $GITHUB_OUTPUT
          else
            echo "❌ blacklist.txt не найден!"
            exit 1
          fi
          
          echo "✅ Все файлы созданы успешно"

      - name: 📝 Commit and Push Files
        env:
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN }}
        run: |
          echo "=== КОММИТ ИЗМЕНЕНИЙ ==="
          echo "Текущая директория: $(pwd)"
          echo ""
          
          # Настраиваем git
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # 1. Показываем состояние файлов
          echo "🔍 Проверяем файлы:"
          ls -la *.bin *.txt *.md
          
          echo ""
          echo "📏 Размеры файлов:"
          for file in bloom_filter.bin blacklist.txt README.md; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file")
              size_kb=$((size / 1024))
              echo "  $file: $size байт ($size_kb KB)"
            else
              echo "  ❌ $file: НЕ НАЙДЕН!"
              exit 1
            fi
          done
          
          echo ""
          echo "🔧 Настраиваем git для бинарных файлов..."
          # Убеждаемся что git отслеживает бинарные файлы
          git config core.autocrlf false
          
          # 2. Проверяем текущий статус git
          echo ""
          echo "📊 Git статус ДО:"
          git status --short
          
          # 3. ОЧЕНЬ ВАЖНО: Сначала удаляем bloom_filter.bin из git
          echo ""
          echo "🔄 Подготавливаем bloom_filter.bin для коммита..."
          
          # Проверяем отслеживается ли файл
          if git ls-files --error-unmatch bloom_filter.bin >/dev/null 2>&1; then
            echo "  bloom_filter.bin отслеживается git"
            echo "  Удаляем из индекса..."
            git rm --cached bloom_filter.bin
          else
            echo "  bloom_filter.bin НЕ отслеживается git"
          fi
          
          # 4. Добавляем ВСЕ файлы
          echo ""
          echo "➕ Добавляем файлы в git..."
          
          # Сначала bloom_filter.bin отдельно
          git add bloom_filter.bin
          
          # Проверяем добавился ли
          BLOOM_STATUS=$(git status --porcelain bloom_filter.bin)
          if [ -z "$BLOOM_STATUS" ]; then
            echo "⚠️  bloom_filter.bin не добавился, пробуем с -f..."
            git add -f bloom_filter.bin
          fi
          
          # Добавляем остальные
          git add blacklist.txt README.md
          
          # 5. Проверяем что добавилось
          echo ""
          echo "📋 Git статус ПОСЛЕ добавления:"
          git status --short
          
          # 6. Коммитим если есть изменения
          echo ""
          echo "🔍 Проверяем изменения для коммита..."
          
          if git diff --cached --quiet; then
            echo "ℹ️  Нет изменений для коммита"
            echo "Пробуем принудительно обновить файлы..."
            
            # Создаем метку времени чтобы git увидел изменение
            TIMESTAMP=$(date +%s)
            echo "# Updated at $TIMESTAMP" >> README.md
            git add README.md bloom_filter.bin blacklist.txt
            
            if git diff --cached --quiet; then
              echo "✅ Всё уже актуально. Выходим."
              exit 0
            fi
          fi
          
          # 7. Создаем коммит
          echo ""
          echo "💾 Создаем коммит..."
          
          DATE=$(date +'%Y-%m-%d')
          DOMAIN_COUNT=$(grep -v '^#' blacklist.txt | grep -c '\.')
          BLOOM_SIZE=$(stat -c%s bloom_filter.bin)
          BLOOM_SIZE_KB=$((BLOOM_SIZE / 1024))
          
          echo "📊 Данные коммита:"
          echo "  • Дата: $DATE"
          echo "  • Доменов: $DOMAIN_COUNT"
          echo "  • Размер фильтра: $BLOOM_SIZE_KB KB"
          
          COMMIT_MSG="Auto update ${DATE} - ${DOMAIN_COUNT} domains, ${BLOOM_SIZE_KB} KB filter"
          echo "📝 Сообщение: $COMMIT_MSG"
          
          git commit -m "$COMMIT_MSG"
          
          # 8. Пушим
          echo ""
          echo "🚀 Пушим изменения..."
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          
          echo ""
          echo "✅ КОММИТ ВЫПОЛНЕН УСПЕШНО!"
          echo "🎉 Все файлы должны быть обновлены в репозитории"
          
      - name: ✅ Final Check
        run: |
          echo "=== ФИНАЛЬНАЯ ПРОВЕРКА ==="
          echo "✅ Workflow выполнен успешно"
          echo "🕐 Время: $(date)"
          echo ""
          echo "Если bloom_filter.bin всё ещё не обновляется,"
          echo "проверьте настройки .gitattributes и .gitignore"

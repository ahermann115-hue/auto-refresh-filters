name: Daily Filter Update

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:      # Manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_UPDATE_TOKEN }}
          ref: main

      - name: 🔐 Check token
        run: |
          if [ -z "${{ secrets.AUTO_UPDATE_TOKEN }}" ]; then
            echo "ERROR: AUTO_UPDATE_TOKEN not set!"
            exit 1
          fi
          echo "Token is available"

      - name: 🐍 Setup Python
        run: |
          python3 --version
          pip install mmh3 bitarray --quiet

      - name: 🔧 Setup permissions
        run: |
          chmod +x update.sh

      - name: 🚀 Run update script
        id: run_update
        run: |
          echo "🚀 Запускаем скрипт обновления..."
          ./update.sh
          
          # СНАЧАЛА создаем файлы, ПОТОМ получаем статистику
          echo "📊 Получаем статистику..."
          
          if [ -f "blacklist.txt" ]; then
            DOMAIN_COUNT=$(grep -v '^#' blacklist.txt | grep -c '\.')
            echo "✅ Доменов найдено: $DOMAIN_COUNT"
            echo "DOMAIN_COUNT=${DOMAIN_COUNT}" >> $GITHUB_OUTPUT
          else
            echo "❌ blacklist.txt не найден!"
            exit 1
          fi
          
          if [ -f "bloom_filter.bin" ]; then
            BLOOM_SIZE=$(stat -c%s bloom_filter.bin)
            BLOOM_SIZE_KB=$((BLOOM_SIZE / 1024))
            echo "✅ Размер фильтра: $BLOOM_SIZE байт ($BLOOM_SIZE_KB KB)"
            echo "BLOOM_SIZE_KB=${BLOOM_SIZE_KB}" >> $GITHUB_OUTPUT
            
            # Проверяем что файл не пустой
            if [ "$BLOOM_SIZE" -lt 1000 ]; then
              echo "❌ ОШИБКА: bloom_filter.bin слишком мал!"
              exit 1
            fi
          else
            echo "❌ bloom_filter.bin не найден!"
            exit 1
          fi
          
          echo "✅ Все файлы созданы успешно"

      # ВАЖНО: Этот шаг ДОЛЖЕН быть ПОСЛЕ run_update
      - name: 📝 Commit and Push Files
        env:
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN }}
        run: |
          echo "📝 Начинаем коммит файлов..."
          
          # Проверяем что файлы действительно созданы
          echo "🔍 Проверяем наличие файлов:"
          ls -la bloom_filter.bin blacklist.txt README.md 2>/dev/null || {
            echo "❌ Файлы не найдены!"
            exit 1
          }
          
          # Настраиваем git
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # ВАЖНО: Теперь добавляем файлы ПОСЛЕ их создания
          echo "📤 Добавляем файлы в git..."
          git add bloom_filter.bin blacklist.txt README.md
          
          # Проверяем есть ли изменения
          if git diff --cached --quiet; then
            echo "ℹ️ Нет изменений для коммита"
            echo "✅ Workflow завершен без изменений"
            exit 0
          fi
          
          # Создаем коммит
          echo "💾 Создаем коммит..."
          
          # Получаем данные ИЗ ФАЙЛОВ (не из окружения)
          DOMAIN_COUNT=$(grep -v '^#' blacklist.txt | grep -c '\.' 2>/dev/null || echo "0")
          BLOOM_SIZE=$(stat -c%s bloom_filter.bin 2>/dev/null || echo "0")
          BLOOM_SIZE_KB=$((BLOOM_SIZE / 1024))
          DATE=$(date +'%Y-%m-%d')
          
          echo "📊 Статистика для коммита:"
          echo "  • Дата: $DATE"
          echo "  • Доменов: $DOMAIN_COUNT"
          echo "  • Размер фильтра: $BLOOM_SIZE_KB KB"
          
          # Простое сообщение коммита
          git commit -m "Auto update ${DATE} - ${DOMAIN_COUNT} domains, ${BLOOM_SIZE_KB} KB filter"
          
          echo "🚀 Пушим изменения..."
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          
          echo "✅ Файлы успешно обновлены!"
          echo "   • bloom_filter.bin: $BLOOM_SIZE байт"
          echo "   • blacklist.txt: $DOMAIN_COUNT доменов"
          echo "   • README.md: обновлен"

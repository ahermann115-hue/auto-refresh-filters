name: Daily Filter Update

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:      # Manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_UPDATE_TOKEN }}
          ref: main

      - name: 🔐 Check token
        run: |
          if [ -z "${{ secrets.AUTO_UPDATE_TOKEN }}" ]; then
            echo "ERROR: AUTO_UPDATE_TOKEN not set!"
            exit 1
          fi
          echo "✅ Token is available"

      - name: 🐍 Setup Python
        run: |
          python3 --version
          pip install mmh3 bitarray --quiet

      - name: 🔧 Setup permissions
        run: |
          chmod +x update.sh

      - name: 🚀 Run update script
        id: run_update
        run: |
          echo "🚀 Запускаем скрипт обновления..."
          ./update.sh
          
          echo "📊 Проверяем созданные файлы..."
          
          # Проверяем bloom_filter.bin
          if [ -f "bloom_filter.bin" ]; then
            BLOOM_SIZE=$(stat -c%s bloom_filter.bin)
            BLOOM_SIZE_KB=$((BLOOM_SIZE / 1024))
            echo "✅ bloom_filter.bin: $BLOOM_SIZE байт ($BLOOM_SIZE_KB KB)"
            echo "BLOOM_SIZE_KB=${BLOOM_SIZE_KB}" >> $GITHUB_OUTPUT
            
            if [ "$BLOOM_SIZE" -lt 1000 ]; then
              echo "❌ ОШИБКА: bloom_filter.bin слишком мал!"
              exit 1
            fi
          else
            echo "❌ bloom_filter.bin не найден!"
            exit 1
          fi
          
          # Проверяем blacklist.txt
          if [ -f "blacklist.txt" ]; then
            DOMAIN_COUNT=$(grep -v '^#' blacklist.txt | grep -c '\.')
            echo "✅ blacklist.txt: $DOMAIN_COUNT доменов"
            echo "DOMAIN_COUNT=${DOMAIN_COUNT}" >> $GITHUB_OUTPUT
          else
            echo "❌ blacklist.txt не найден!"
            exit 1
          fi
          
          # Проверяем что нет лишних файлов
          echo ""
          echo "🧹 Проверяем временные файлы..."
          TEMP_FILES=$(ls raw*.txt raw*_backup.txt domains*.txt filtered*.txt whitelist*.txt 2>/dev/null | wc -l)
          if [ "$TEMP_FILES" -gt 0 ]; then
            echo "⚠️  Найдены временные файлы: $TEMP_FILES"
            echo "Они будут удалены перед коммитом"
          fi
          
          echo "✅ Все файлы созданы успешно"

      - name: 📝 Clean and Commit
        env:
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN }}
        run: |
          echo "=== ОЧИСТКА И КОММИТ ==="
          echo ""
          
          # 1. УДАЛЯЕМ ВСЕ ВРЕМЕННЫЕ ФАЙЛЫ
          echo "🧹 Удаляем все временные файлы..."
          rm -f raw*.txt raw*_backup.txt domains*.txt filtered*.txt whitelist*.txt 2>/dev/null || true
          
          echo ""
          echo "📁 Оставшиеся файлы в директории:"
          ls -la
          
          # 2. Настраиваем git
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # 3. ПРИНУДИТЕЛЬНО ОБНОВЛЯЕМ bloom_filter.bin
          echo ""
          echo "🔄 Принудительно обновляем bloom_filter.bin в git..."
          
          # Сохраняем хэш файла для проверки
          OLD_HASH=$(git hash-object bloom_filter.bin 2>/dev/null || echo "none")
          NEW_HASH=$(sha256sum bloom_filter.bin | cut -d' ' -f1 2>/dev/null || echo "none")
          
          echo "   Старый хэш в git: ${OLD_HASH:0:8}..."
          echo "   Новый хэш файла: ${NEW_HASH:0:8}..."
          
          if [ "$OLD_HASH" = "$NEW_HASH" ] && [ "$OLD_HASH" != "none" ]; then
            echo "   ⚠️  Хэши совпадают, но всё равно обновляем"
          fi
          
          # 4. Удаляем bloom_filter.bin из git и добавляем заново
          git rm --cached bloom_filter.bin 2>/dev/null || true
          
          # 5. Добавляем ВСЕ основные файлы
          echo ""
          echo "➕ Добавляем файлы в git..."
          git add bloom_filter.bin blacklist.txt README.md
          
          # 6. Проверяем что bloom_filter.bin добавлен
          echo ""
          echo "🔍 Проверяем статус файлов:"
          git status --porcelain | while read status file; do
            if [ "$file" = "bloom_filter.bin" ]; then
              echo "   ✅ bloom_filter.bin: $status"
            elif [ "$file" = "blacklist.txt" ]; then
              echo "   ✅ blacklist.txt: $status"
            elif [ "$file" = "README.md" ]; then
              echo "   ✅ README.md: $status"
            else
              echo "   📄 $file: $status"
            fi
          done
          
          # 7. Коммит
          echo ""
          echo "💾 Создаем коммит..."
          
          DATE=$(date +'%Y-%m-%d')
          DOMAIN_COUNT=$(grep -v '^#' blacklist.txt | grep -c '\.' 2>/dev/null || echo "0")
          BLOOM_SIZE=$(stat -c%s bloom_filter.bin 2>/dev/null || echo "0")
          BLOOM_SIZE_KB=$((BLOOM_SIZE / 1024))
          
          echo "📊 Статистика:"
          echo "   • Дата: $DATE"
          echo "   • Доменов: $DOMAIN_COUNT"
          echo "   • Размер фильтра: $BLOOM_SIZE_KB KB"
          
          # Проверяем есть ли изменения
          if git diff --cached --quiet; then
            echo "ℹ️  Нет изменений для коммита"
            echo "🕐 Добавляем метку времени..."
            echo "" >> README.md
            echo "<!-- Last update: $(date) -->" >> README.md
            git add README.md
            
            if git diff --cached --quiet; then
              echo "✅ Всё уже актуально"
              exit 0
            else
              echo "📝 Коммитим только обновление времени"
              git commit -m "Update timestamp - $(date +'%Y-%m-%d %H:%M')"
            fi
          else
            COMMIT_MSG="Auto update ${DATE} - ${DOMAIN_COUNT} domains, ${BLOOM_SIZE_KB} KB filter"
            echo "📝 Коммит: $COMMIT_MSG"
            git commit -m "$COMMIT_MSG"
          fi
          
          # 8. Пушим
          echo ""
          echo "🚀 Пушим изменения..."
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          
          echo ""
          echo "✅ ВСЁ ГОТОВО!"
          echo "🎉 Файлы должны быть обновлены в репозитории"

      - name: ✅ Final Status
        run: |
          echo "=== ФИНАЛЬНЫЙ СТАТУС ==="
          echo "✅ Workflow выполнен: $(date)"
          echo "📅 Следующее обновление: завтра в 00:00 UTC"
